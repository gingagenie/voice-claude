<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0c0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Claude">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Voice Claude</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --border: #1e2530;
    --accent: #00d4ff;
    --accent-dim: rgba(0,212,255,0.12);
    --accent-glow: rgba(0,212,255,0.4);
    --danger: #ff4466;
    --green: #44ff99;
    --text: #c8d8e8;
    --text-dim: #4a5a6a;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow', sans-serif;
  }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: fixed;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .container {
    width: 100%; max-width: 440px;
    padding: 20px;
    display: flex; flex-direction: column;
    align-items: center; gap: 24px;
  }

  .header { text-align: center; }
  .header h1 {
    font-family: var(--mono); font-size: 13px;
    letter-spacing: 0.3em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .header p { font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; }

  /* API key setup */
  .api-setup {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .api-setup label {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase;
  }
  .api-setup input {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 8px 12px;
    font-family: var(--mono); font-size: 12px;
    color: var(--text); outline: none; width: 100%;
    transition: border-color 0.2s;
  }
  .api-setup input:focus { border-color: var(--accent); }
  .api-setup button {
    background: var(--accent-dim); border: 1px solid var(--accent);
    border-radius: 4px; padding: 8px 16px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.15em; color: var(--accent);
    cursor: pointer; text-transform: uppercase;
    transition: all 0.2s;
  }
  .api-setup button:hover { background: rgba(0,212,255,0.22); }
  .api-hint { font-size: 10px; color: var(--text-dim); line-height: 1.5; }
  .api-hint a { color: var(--accent); text-decoration: none; }

  .main-ui { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; }

  .transcript-area {
    width: 100%; min-height: 90px; max-height: 180px;
    overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
    font-family: var(--mono); font-size: 12px;
    line-height: 1.7; color: var(--text-dim);
    display: flex; flex-direction: column; gap: 8px;
  }
  .transcript-area::-webkit-scrollbar { width: 4px; }
  .transcript-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg-label { font-size: 10px; letter-spacing: 0.1em; min-width: 28px; padding-top: 1px; }
  .msg.user .msg-label { color: var(--accent); }
  .msg.claude .msg-label { color: #ff9944; }
  .msg-text { color: var(--text); flex: 1; }
  .placeholder { color: var(--text-dim); font-size: 11px; letter-spacing: 0.08em; margin: auto; text-align: center; }

  .vol-bar { width: 100%; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .vol-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 2px; transition: width 0.05s; }

  .status {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.15em; color: var(--text-dim);
    height: 16px; text-align: center;
    transition: color 0.3s; text-transform: uppercase;
  }
  .status.recording { color: var(--danger); animation: blink 1s ease infinite; }
  .status.thinking { color: var(--accent); }
  .status.speaking { color: var(--green); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .btn-wrap { position: relative; display: flex; align-items: center; justify-content: center; }

  .ring { position: absolute; border-radius: 50%; border: 1px solid var(--accent); opacity: 0; pointer-events: none; }
  .ring-1 { width: 160px; height: 160px; }
  .ring-2 { width: 200px; height: 200px; }
  .ring-3 { width: 240px; height: 240px; }
  .recording-active .ring-1 { animation: ripple 1.5s ease-out infinite; }
  .recording-active .ring-2 { animation: ripple 1.5s ease-out 0.3s infinite; }
  .recording-active .ring-3 { animation: ripple 1.5s ease-out 0.6s infinite; }
  @keyframes ripple { 0%{transform:scale(0.8);opacity:0.6} 100%{transform:scale(1.1);opacity:0} }

  .ptt-btn {
    width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--accent-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    position: relative; z-index: 2;
    -webkit-tap-highlight-color: transparent;
    user-select: none; touch-action: none;
    box-shadow: 0 0 20px rgba(0,212,255,0.1), inset 0 0 20px rgba(0,212,255,0.05);
  }
  .ptt-btn.active {
    background: rgba(255,68,102,0.15); border-color: var(--danger);
    box-shadow: 0 0 30px rgba(255,68,102,0.4), inset 0 0 20px rgba(255,68,102,0.1);
    transform: scale(0.95);
  }
  .ptt-btn.speaking-state {
    background: rgba(68,255,153,0.1); border-color: var(--green);
    box-shadow: 0 0 30px rgba(68,255,153,0.3);
  }
  .ptt-btn svg {
    width: 38px; height: 38px; fill: none;
    stroke: var(--accent); stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke 0.15s;
  }
  .ptt-btn.active svg { stroke: var(--danger); }
  .ptt-btn.speaking-state svg { stroke: var(--green); }

  .btn-label {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.2em; color: var(--text-dim);
    text-transform: uppercase; margin-top: 16px; text-align: center;
  }

  .stop-btn {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.15em; color: var(--text-dim);
    background: none; border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 14px;
    cursor: pointer; text-transform: uppercase;
    transition: all 0.2s; display: none; margin-top: 8px;
  }
  .stop-btn.visible { display: block; }
  .stop-btn:hover { border-color: var(--danger); color: var(--danger); }

  .error-msg { font-family: var(--mono); font-size: 11px; color: var(--danger); text-align: center; letter-spacing: 0.05em; min-height: 16px; }

  .key-link {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-dim); text-align: center; cursor: pointer;
    letter-spacing: 0.1em; text-decoration: underline;
  }
  .key-link:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Voice Claude</h1>
    <p>tap to talk · tap again to send</p>
  </div>

  <!-- API Key Setup Screen -->
  <div class="api-setup" id="apiSetup">
    <label>Anthropic API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off" />
    <button onclick="saveKey()">Save & Start</button>
    <p class="api-hint">
      Get a free key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a><br>
      Stored locally on your device only. Never sent anywhere except Anthropic.
    </p>
  </div>

  <!-- Main UI (hidden until key saved) -->
  <div class="main-ui" id="mainUI" style="display:none">
    <div class="transcript-area" id="transcript">
      <span class="placeholder" id="placeholder">// tap and hold the button to speak</span>
    </div>

    <div class="vol-bar"><div class="vol-fill" id="volFill"></div></div>
    <div class="status" id="status">ready</div>

    <div class="btn-wrap" id="btnWrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <button class="ptt-btn" id="pttBtn">
        <svg viewBox="0 0 24 24">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
        </svg>
      </button>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="btn-label" id="btnLabel">tap to speak</div>
      <button class="stop-btn" id="stopBtn" onclick="stopSpeaking()">■ stop</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <span class="key-link" onclick="resetKey()">change api key</span>
  </div>
</div>

<script>
  // ── API Key Management ─────────────────────────────────
  let API_KEY = localStorage.getItem('vc_api_key') || '';

  function saveKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val.startsWith('sk-')) {
      alert('That doesn\'t look right — should start with sk-ant-');
      return;
    }
    API_KEY = val;
    localStorage.setItem('vc_api_key', val);
    showMainUI();
  }

  function resetKey() {
    localStorage.removeItem('vc_api_key');
    API_KEY = '';
    document.getElementById('apiSetup').style.display = 'flex';
    document.getElementById('mainUI').style.display = 'none';
  }

  function showMainUI() {
    document.getElementById('apiSetup').style.display = 'none';
    document.getElementById('mainUI').style.display = 'flex';
    initPTT();
  }

  if (API_KEY) showMainUI();

  // Enter key on input
  document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveKey();
  });

  // ── State ──────────────────────────────────────────────
  let recognition = null;
  let isRecording = false;
  let currentTranscript = '';
  let lastInterim = '';
  let speechSynth = window.speechSynthesis;
  let conversationHistory = [];
  let audioCtx = null, analyser = null, volInterval = null, mediaStream = null;

  let btn, btnWrap, statusEl, transcriptEl, placeholder, volFill, stopBtn, errorMsg, btnLabel;

  function initPTT() {
    btn = document.getElementById('pttBtn');
    btnWrap = document.getElementById('btnWrap');
    statusEl = document.getElementById('status');
    transcriptEl = document.getElementById('transcript');
    placeholder = document.getElementById('placeholder');
    volFill = document.getElementById('volFill');
    stopBtn = document.getElementById('stopBtn');
    errorMsg = document.getElementById('errorMsg');
    btnLabel = document.getElementById('btnLabel');

    // Toggle tap (tap to start, tap again to send)
    btn.addEventListener('touchstart', e => { e.preventDefault(); toggleRecording(); }, { passive: false });
    btn.addEventListener('click', e => { if (!('ontouchstart' in window)) toggleRecording(); });

    // Spacebar toggle
    document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggleRecording(); } });

    // Load voices
    speechSynth.onvoiceschanged = () => speechSynth.getVoices();
  }

  // ── Speech Recognition ─────────────────────────────────
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showError('Speech recognition not supported. Use Chrome on Android.'); return null; }
    const r = new SR();
    r.continuous = true; r.interimResults = true; r.lang = 'en-AU';
    r.onresult = (e) => {
      let final = '';
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) currentTranscript = (currentTranscript + ' ' + final).trim();
      if (interim) lastInterim = interim;
      const liveEl = document.getElementById('liveInterim');
      if (liveEl) liveEl.textContent = currentTranscript || interim;
    };
    r.onerror = (e) => { if (e.error !== 'aborted') showError('Mic error: ' + e.error); };
    return r;
  }

  // ── Volume viz ─────────────────────────────────────────
  async function startVolViz() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      audioCtx.createMediaStreamSource(mediaStream).connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      volInterval = setInterval(() => {
        analyser.getByteFrequencyData(data);
        volFill.style.width = Math.min(100, (data.reduce((a,b)=>a+b,0)/data.length)*2.5) + '%';
      }, 50);
    } catch(e) {}
  }

  function stopVolViz() {
    clearInterval(volInterval); volFill.style.width = '0%';
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  }

  // ── PTT ────────────────────────────────────────────────
  function toggleRecording() {
    if (isRecording) stopRecording();
    else startRecording();
  }

  function startRecording() {
    if (isRecording) return;
    if (speechSynth.speaking) speechSynth.cancel();
    clearError(); isRecording = true; currentTranscript = ''; lastInterim = '';
    btn.classList.add('active');
    btnWrap.classList.add('recording-active');
    setStatus('recording', '● recording');
    btnLabel.textContent = 'tap again to send';
    addMessage('user-live', '');
    recognition = setupRecognition();
    if (recognition) recognition.start();
    startVolViz();
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    btn.classList.remove('active');
    btnWrap.classList.remove('recording-active');
    btnLabel.textContent = 'hold to speak';
    stopVolViz();
    if (recognition) { recognition.stop(); recognition = null; }
    const liveEl = document.getElementById('liveInterim');
    if (liveEl) {
      liveEl.id = '';
      const best = currentTranscript || lastInterim;
      if (!best) { liveEl.closest('.msg')?.remove(); setStatus('', 'ready'); return; }
      currentTranscript = best;
      liveEl.textContent = best;
    }
    if (currentTranscript.trim()) sendToClaude(currentTranscript.trim());
    else setStatus('', 'ready');
  }

  // ── Transcript ─────────────────────────────────────────
  function addMessage(role, text) {
    if (placeholder) placeholder.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + (role.startsWith('user') ? 'user' : 'claude');
    const label = document.createElement('span');
    label.className = 'msg-label';
    label.textContent = role.startsWith('user') ? 'YOU' : 'AI';
    const span = document.createElement('span');
    span.className = 'msg-text'; span.textContent = text;
    if (role === 'user-live') span.id = 'liveInterim';
    div.appendChild(label); div.appendChild(span);
    transcriptEl.appendChild(div);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    return span;
  }

  // ── Claude API ─────────────────────────────────────────
  async function sendToClaude(text) {
    setStatus('thinking', '◌ thinking...');
    conversationHistory.push({ role: 'user', content: text });
    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': API_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'anthropic-beta': 'messages-2023-12-15'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'You are a helpful voice assistant. Respond in natural spoken language only — no markdown, no bullet points, no dashes, no asterisks. Keep answers concise since they will be read aloud.',
          messages: conversationHistory
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.content?.find(b => b.type === 'text')?.text || '';
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('claude', reply);
      speak(reply);
    } catch(err) {
      setStatus('', 'ready');
      showError('Error: ' + err.message);
    }
  }

  // ── TTS ────────────────────────────────────────────────
  function getBestVoice() {
    const voices = speechSynth.getVoices();
    // Priority list - these are the good ones across Android Chrome / desktop
    const preferred = [
      'Google UK English Male',
      'Google UK English Female',
      'Google Australian English',
      'Google US English',
      'Karen',      // macOS/iOS Australian
      'Daniel',     // macOS/iOS UK
      'Samantha',   // macOS US
    ];
    for (const name of preferred) {
      const v = voices.find(v => v.name === name);
      if (v) return v;
    }
    // Fallback: any remote/network voice (better quality than local)
    const remote = voices.find(v => !v.localService && v.lang.startsWith('en'));
    if (remote) return remote;
    // Last resort: any English
    return voices.find(v => v.lang.startsWith('en')) || null;
  }

  function speak(text) {
    if (!text) return;
    speechSynth.cancel();
    const clean = text.replace(/[#*`_~\-]/g, '').replace(/\n+/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-AU'; u.rate = 1.0; u.pitch = 1;
    const best = getBestVoice();
    if (best) u.voice = best;
    u.onstart = () => { btn.classList.add('speaking-state'); setStatus('speaking', '◎ speaking'); stopBtn.classList.add('visible'); };
    u.onend = () => { btn.classList.remove('speaking-state'); setStatus('', 'ready'); stopBtn.classList.remove('visible'); };
    u.onerror = () => { btn.classList.remove('speaking-state'); setStatus('', 'ready'); stopBtn.classList.remove('visible'); };
    speechSynth.speak(u);
  }

  function stopSpeaking() {
    speechSynth.cancel();
    btn?.classList.remove('speaking-state');
    setStatus('', 'ready');
    stopBtn.classList.remove('visible');
  }

  function setStatus(cls, text) { statusEl.className = 'status ' + cls; statusEl.textContent = text; }
  function showError(msg) { errorMsg.textContent = msg; }
  function clearError() { errorMsg.textContent = ''; }
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
